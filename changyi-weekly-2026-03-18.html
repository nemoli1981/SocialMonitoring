<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>樟宜机场 - weekly</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; padding: 20px; }
    .container { max-width: 1200px; margin: 0 auto; }
    .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 40px; border-radius: 16px; margin-bottom: 30px; }
    .header h1 { font-size: 32px; margin-bottom: 10px; }
    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 30px; }
    .stat-card { background: white; padding: 24px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); text-align: center; }
    .stat-value { font-size: 36px; font-weight: bold; color: #333; }
    .charts-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; margin-bottom: 30px; }
    .chart-card { background: white; padding: 24px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .chart { height: 300px; }
    .insights { background: white; padding: 24px; border-radius: 12px; margin-bottom: 20px; }
    .insight-item { padding: 12px; background: #f8f9fa; border-radius: 8px; margin-bottom: 8px; border-left: 4px solid #667eea; }
    .footer { text-align: center; color: #999; margin-top: 40px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>樟宜机场 舆情周报</h1>
      <p>weekly | 2026-03-18 | 数据周期：近7天</p>
    </div>
    
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-value">39</div><div>总帖子数</div></div>
      <div class="stat-card"><div class="stat-value">12,314</div><div>总点赞数</div></div>
      <div class="stat-card"><div class="stat-value">19</div><div>小红书</div></div>
      <div class="stat-card"><div class="stat-value">20</div><div>微博</div></div>
    </div>
    
    <div class="charts-grid">
      <div class="chart-card">
        <h3>情感分布</h3>
        <div id="sentimentChart" class="chart"></div>
      </div>
      <div class="chart-card">
        <h3>平台声量</h3>
        <div id="platformChart" class="chart"></div>
      </div>
    </div>
    
    <div class="insights">
      <h3>💡 核心洞察</h3>
      <div class="insight-item">星耀樟宜的室内瀑布是核心吸引力，打卡类内容在小红书获得稳定互动</div>
      <div class="insight-item">微博平台上，关于新航服务、新中建交等话题获得高赞</div>
      <div class="insight-item">落地时间、拍照攻略等实用信息在小红书上有较高互动</div>
    </div>
    
    <div class="insights">
      <h3>📋 行动建议</h3>
      <div class="insight-item">持续强化星耀樟宜瀑布作为视觉符号，鼓励用户生成内容</div>
      <div class="insight-item">结合新航服务优势，策划情感向内容在微博引发共鸣</div>
      <div class="insight-item">针对小红书用户，推出机场过夜、清晨落地活动指南</div>
    </div>
    
    <div class="footer">
      <p>舆情监控系统 V6</p>
    </div>
  </div>
  
  <script>
    echarts.init(document.getElementById('sentimentChart')).setOption({
      series: [{
        type: 'pie',
        radius: ['40%', '70%'],
        data: [
          { value: 85, name: '正面', itemStyle: { color: '#52c41a' } },
          { value: 15, name: '中性', itemStyle: { color: '#faad14' } },
          { value: 0, name: '负面', itemStyle: { color: '#f5222d' } }
        ]
      }]
    });
    echarts.init(document.getElementById('platformChart')).setOption({
      xAxis: { type: 'category', data: ['小红书', '微博', '抖音'] },
      yAxis: { type: 'value' },
      series: [{ data: [19, 20, 0], type: 'bar' }]
    });
  </script>
</body>
</html>
